name: "Tests"

on: [ pull_request ]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build
        run: |
          export PHP_VERSION=${{ matrix.php-versions }}
          docker compose build
          docker compose up -d
          sleep 5

      - name: Run Unit Tests
        run: docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite unit

      - name: Run E2E Tests
        run: docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite e2e
