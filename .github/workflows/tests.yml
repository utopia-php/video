name: "Tests"

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build
        run: |
          export PHP_VERSION=${{ matrix.php-versions }}
          docker compose build
          docker compose up -d

      # The container is ready when PHP and both binaries answer, which is a
      # question worth asking rather than a wait worth guessing at.
      - name: Wait for the container
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T tests sh -c 'php -v && ffmpeg -version && ffprobe -version' >/dev/null 2>&1; then
              echo "ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "the test container never became ready"
          docker compose logs
          exit 1

      - name: Run Unit Tests
        run: docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite unit

      - name: Run E2E Tests
        run: docker compose exec -T tests vendor/bin/phpunit --configuration phpunit.xml --testsuite e2e
